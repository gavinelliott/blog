<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"/><style>
@font-face{font-family:Edition;src:url('{{DISPLAY_FONT}}')}@font-face{font-family:UI;src:url('{{UI_FONT}}');font-weight:700}@font-face{font-family:"Edition Serif";src:url('{{SERIF_FONT}}')}
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#f4ecd8;color:#172017;padding:32px 40px 0;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}header{display:flex;justify-content:space-between;align-items:center;height:61px;flex-shrink:0;border-top:3px solid #172017;border-bottom:2px solid #172017;font:700 17px UI,Arial;text-transform:uppercase;letter-spacing:.015em}.brand{font:400 37px/1 Edition,Impact;letter-spacing:-.02em}.star{color:#075331;font-size:24px;margin:0 15px}.edition{display:flex;align-items:center}.main{flex:1;min-height:0;display:grid;grid-template-columns:760px 1fr;grid-template-rows:minmax(0,1fr);gap:22px;padding:25px 0 24px}.copy{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0;padding-right:24px}.eyebrow{font:700 15px UI,Arial;color:#075331;margin:0 0 20px;text-transform:uppercase;letter-spacing:.07em}h1{font:400 65px/1.13 Edition,Impact;text-transform:uppercase;letter-spacing:-.025em;margin:0;word-break:normal;overflow-wrap:normal;text-wrap:balance}.default h1{font-size:126px;line-height:1.03;letter-spacing:-.035em}.default .eyebrow{margin-bottom:14px}.intro{font:400 27px/1.3 "Edition Serif",Georgia;margin:20px 0 0;max-width:710px}.portrait{min-height:0;border-left:1px solid #767666;display:flex;align-items:center;justify-content:center;position:relative}.portrait img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.stamp{position:absolute;bottom:12px;left:18px;transform:rotate(-8deg);background:#f3d331;color:#172017;border:2px solid #172017;padding:10px 12px;font:700 15px/1.2 UI,Arial;text-transform:uppercase}footer{height:62px;flex-shrink:0;margin:0 -40px;background:#075331;color:#f4ecd8;display:flex;align-items:center;justify-content:space-between;padding:0 40px;font:700 17px UI,Arial}footer span:last-child{color:#f3d331}.arrow{font-size:28px;margin-left:12px}
</style></head><body class="{{CLASS}}"><header><span class="brand">{{MASTHEAD}}</span><span class="edition"><svg width="24" height="24" viewBox="0 0 24 24" style="margin-right:16px" aria-hidden="true"><path d="M12 0L14 8L21 3L16 10L24 12L16 14L21 21L14 16L12 24L10 16L3 21L8 14L0 12L8 10L3 3L10 8Z" fill="#075331"/></svg>{{EDITION}}</span></header><div class="main"><div class="copy"><p class="eyebrow">{{EYEBROW}}</p><h1>{{TITLE}}</h1>{{INTRO}}</div><div class="portrait"><img src="{{PORTRAIT}}" alt=""/><div class="stamp">From the<br/>North East.</div></div></div><footer><span>gavinelliott.co.uk</span><span>WORDS, WORK & WHATEVER ELSE <svg width="26" height="20" viewBox="0 0 26 20" style="vertical-align:middle;margin-left:12px" aria-hidden="true"><path d="M0 10H23M15 2L23 10L15 18" fill="none" stroke="#f3d331" stroke-width="3"/></svg></span></footer></body></html>
